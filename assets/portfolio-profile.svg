<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffd76d"/>
      <stop offset="45%" stop-color="#f5bd3a"/>
      <stop offset="100%" stop-color="#f7d77e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#f3f3f3"/>

  <g transform="translate(600 440)">
    <!-- Outer yellow ring -->
    <circle r="430" fill="#0d1419" stroke="url(#gold)" stroke-width="38"/>

    <!-- Main JK letters -->
    <text x="0" y="-30" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="250" font-weight="900" fill="#f4f4f4" letter-spacing="-12">JK</text>

    <!-- Brand text -->
    <text x="0" y="160" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="118" font-weight="900" fill="#f4f4f4" letter-spacing="-3">SignMaker&apos;S</text>

    <!-- Gold underline -->
    <path d="M -210 205 L 210 205" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>

    <!-- Tagline -->
    <text x="0" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#f4f4f4" letter-spacing="2">YOUR SIGN. YOUR BRAND. OUR CRAFT.</text>
  </g>
</svg>
