<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" x2="1">
      <stop offset="0%" stop-color="#efefee"/>
      <stop offset="100%" stop-color="#d7d9d4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#1e2f38"/>
      <stop offset="100%" stop-color="#0b161d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8ddb2"/>
      <stop offset="25%" stop-color="#e5bc7d"/>
      <stop offset="70%" stop-color="#d19a4b"/>
      <stop offset="100%" stop-color="#f6d7a2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#eecb82" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#eecb82" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>

  <g transform="translate(110 110)">
    <rect x="20" y="70" width="980" height="420" rx="16" fill="url(#panel)"/>
    <rect x="20" y="70" width="980" height="420" rx="16" fill="none" stroke="#172933" stroke-width="8"/>

    <g filter="url(#softGlow)">
      <text x="510" y="305" text-anchor="middle" font-size="176" font-weight="700" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-style="italic" letter-spacing="-4">J.K</text>
      <text x="510" y="400" text-anchor="middle" font-size="90" fill="#f7f8f8" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="10">SIGNMAKER'S</text>
    </g>

    <rect x="110" y="450" width="820" height="18" rx="9" fill="#f4cf89" opacity="0.9"/>
  </g>
</svg>
